<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - PharmaStock</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-header">
                <a href="/" class="logo">PharmaStock</a>

                <h1>Create your account</h1>

                <p>
                    Register to manage your pharmacy inventory.
                </p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <button type="submit" class="primary-button auth-button">
                    Create Account
                </button>

                <p id="registerMessage" class="form-message"></p>

            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
